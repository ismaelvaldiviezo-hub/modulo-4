server.port=8081
spring.application.name=descuento-service

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/descuentos_db
spring.datasource.username=bootcamp_user
spring.datasource.password=bootcamp_password_sec2026
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Puerto de gestión
management.server.port=8091

# Exponer endpoints de Prometheus, Health y Metrics
management.endpoints.web.exposure.include=prometheus,health,metrics

# Etiqueta global para Prometheus
management.metrics.tags.application=descuento-service

# Detalle de salud y sondas Liveness / Readiness para Kubernetes
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# Histogramas de latencia para calculo de percentiles (P95, P99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Nivel de logs
logging.level.root=INFO
logging.level.com.bootcamp.descuento=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# -----------------------------------------------------------------
# CONFIGURACIÓN DE TRAZADO DISTRIBUIDO (JAEGER / OPENTELEMETRY)
# -----------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://jaeger.herramientas.svc.cluster.local:4318/v1/traces