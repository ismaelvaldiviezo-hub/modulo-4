server.port=8080
spring.application.name=productos-service

# URLs de los microservicios internos
services.catalog.url=http://localhost:8082
services.discount.url=http://localhost:8081

# Puerto de gestión
management.server.port=8091

# Exponer endpoints de Prometheus, Health y Metrics
management.endpoints.web.exposure.include=prometheus,health,metrics

# Etiqueta global con el nombre de la aplicación
management.metrics.tags.application=productos-service

# Detalle de salud y sondas Liveness / Readiness para Kubernetes
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# Histogramas de latencia para calculo de percentiles (P95, P99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Nivel de logs
logging.level.root=INFO
logging.level.com.bootcamp.productos=DEBUG

# -----------------------------------------------------------------
# CONFIGURACIÓN DE TRAZADO DISTRIBUIDO (JAEGER / OPENTELEMETRY)
# -----------------------------------------------------------------
# Muestreo al 100% de las peticiones (1.0 = 100%, para desarrollo/lab)
management.tracing.sampling.probability=1.0

# Endpoint OTLP del servicio de Jaeger en el cluster (namespace herramientas)
management.otlp.tracing.endpoint=http://jaeger.herramientas.svc.cluster.local:4318/v1/traces